[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lramb"
version = "0.1.0"
description = "Conserved Active Model B with interchangeable reciprocal long-range kernels"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "scipy>=1.10", "matplotlib>=3.7", "pillow>=9", "tqdm>=4.65"]

[project.optional-dependencies]
torch = ["torch>=2.2"]
notebook = ["jupyterlab>=4", "ipykernel>=6", "nbformat>=5", "nbclient>=0.9"]

[tool.setuptools.packages.find]
include = ["lramb*"]
